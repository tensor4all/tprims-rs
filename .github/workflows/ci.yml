name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-agent-skills.py
      - run: python3 benchmarks/scripts/test_idle_cpus.py
      - run: python3 benchmarks/scripts/test_tblis_decision.py
      - run: bash -n benchmarks/scripts/pinned.sh benchmarks/scripts/paired.sh benchmarks/scripts/build_tblis.sh benchmarks/benchmarks/tprims/contract/run.sh benchmarks/c/run.sh

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The C ABI test links a C program to libtprims.so, which `cargo test`
      # does not build (it only builds the rlib the harness needs).
      - run: cargo build --profile ci -p tprims-capi
      - run: cargo test --profile ci --workspace --no-fail-fast
      # tprims-exec alone, without the `strided` adapter the workspace unifies on.
      - run: cargo test --profile ci -p tprims-exec --no-fail-fast
      # The packed driver's micro-kernels are written for the release profile
      # (thin LTO, one codegen unit); upstream CI tests both.
      - run: cargo test -p tprims-contract --release
      - run: cargo run --release -p tprims-bench --bin tcbench -- info
      # The README's Rust example.
      - run: cargo run --release -p tprims-contract --example readme

  capi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The C test (tests/c_abi.rs) compiles and runs C and C++ programs
      # against the built libtprims.so, one of them against the pinned upstream
      # TAPP headers alone.
      - run: cargo build -p tprims-capi
      - run: cargo test -p tprims-capi
      # Exported symbols: ELF `nm -D` on Linux; Mach-O `nm -gU` on macOS, where
      # C names carry a leading underscore (` _name`).
      - run: |
          if [ "$RUNNER_OS" = macOS ]; then
            syms=$(nm -gU target/debug/libtprims.dylib | sed 's/ _/ /')
          else
            syms=$(nm -D --defined-only target/debug/libtprims.so)
          fi
          echo "$syms" | grep -q ' tprims_abi_version$'
          echo "$syms" | grep -q ' TAPP_destroy_executor$'
          echo "$syms" | grep -q ' TAPP_create_tensor_product$'
          ! echo "$syms" | grep -q ' tprims_blas_'

  c-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p tprims-capi
      # A prebuilt library, then an installed prefix (the layout install.sh
      # produces), each consumed by the CMake example.
      - run: |
          cmake -S examples/c-consumer -B build/prebuilt -DTAPP_USE_CORROSION=OFF
          cmake --build build/prebuilt
          ./build/prebuilt/tapp-c-consumer
      - run: |
          crates/tprims-capi/install.sh --prefix="$PWD/build/prefix"
          cmake -S examples/c-consumer -B build/installed -DTAPP_PREFIX="$PWD/build/prefix"
          cmake --build build/installed
          LD_LIBRARY_PATH="$PWD/build/prefix/lib" ./build/installed/tapp-c-consumer

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
      - run: cargo build --workspace --all-targets

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
